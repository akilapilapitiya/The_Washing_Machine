version: "3.8"

services:
  # Database Service (Matches your local config)
  db:
    image: postgres:15-alpine
    container_name: washing_machine_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
      POSTGRES_DB: ${DB_NAME:-the-washing-machine}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wm-network
    restart: unless-stopped

  # pgAdmin4 (Browser UI for PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: washing_machine_pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - wm-network
    depends_on:
      - db
    restart: unless-stopped

  # Redis Service
  redis:
    image: redis:alpine
    container_name: washing_machine_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - wm-network
    restart: unless-stopped

networks:
  wm-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
