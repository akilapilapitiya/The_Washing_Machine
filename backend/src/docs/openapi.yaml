openapi: 3.0.3

info:
  title: The Washing Machine API
  description: Backend API for Vehicle Service Management System
  version: 1.0.0

servers:
  - url: http://localhost:5500/api
    description: Development server

tags:
  - name: Test
    description: Test routes for checking connections and health
  - name: Customer Authentication
    description: Customer Authentication endpoints
  - name: Employee Authentication
    description: Employee Authentication endpoints
  - name: Employee
    description: Employee management endpoints
  - name: Customer
    description: Customer management endpoints
  - name: Booking
    description: Booking management endpoints
  - name: Payment
    description: Payment processing endpoints
  - name: Vehicle
    description: Vehicle management endpoints
  - name: Service
    description: Service management endpoints
  - name: Feedback
    description: Customer feedback endpoints
paths: {} # empty, will be dynamically merged from paths/*.yaml

components:
  schemas:
    SuccessResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operation completed successfully"
        data:
          type: object
          additionalProperties: true

    ErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Validation Error"
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        debug:
          type: object
          additionalProperties: true

  responses:
    Success:
      description: Request processed successfully
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessResponse"
    Created:
      description: Resource created successfully
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessResponse"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
