/incident:
  post:
    tags:
      - Incident
    summary: Report an incident
    description: Employee reports a new workplace incident
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - title
              - description
            properties:
              title:
                type: string
              description:
                type: string
              priority:
                type: string
                enum: [low, medium, high]
                default: medium
    responses:
      201:
        description: Incident reported successfully
      401:
        $ref: "#/components/responses/Unauthorized"

  get:
    tags:
      - Incident
    summary: Get all incidents
    description: Owner retrieves all reported incidents
    security:
      - bearerAuth: []
    responses:
      200:
        description: List of incidents retrieved
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  type: array
                  items:
                    type: object

/incident/{id}:
  patch:
    tags:
      - Incident
    summary: Update incident status
    description: Owner updates the status of an incident
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - status
            properties:
              status:
                type: string
                enum: [open, in_progress, resolved, closed]
    responses:
      200:
        description: Incident updated successfully
      401:
        $ref: "#/components/responses/Unauthorized"
