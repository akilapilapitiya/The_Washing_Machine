/vehicle:
  get:
    tags:
      - Vehicle
    summary: List Vehicles
    description: Customers see their own vehicles; managers/owners see all vehicles.
    operationId: getCustomerVehicles
    responses:
      "200":
        description: Vehicles retrieved successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SuccessResponse"
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        vehicles:
                          type: array
                          items:
                            $ref: "#/components/schemas/Vehicle"
  post:
    tags:
      - Vehicle
    summary: Create Vehicle
    description: Creates a new vehicle for the authenticated customer.
    operationId: createVehicle
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - vehid
              - vehmileage
              - vehbrand
              - vehmodel
            properties:
              vehid:
                type: string
                example: "ABC-1234"
              vehmileage:
                type: integer
                example: 45000
              vehbrand:
                type: string
                example: Toyota
              vehmodel:
                type: string
                example: Corolla
    responses:
      "201":
        description: Vehicle created successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SuccessResponse"
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        vehicle:
                          $ref: "#/components/schemas/Vehicle"

/vehicle/{vehid}:
  parameters:
    - in: path
      name: vehid
      required: true
      schema:
        type: string
      description: Vehicle ID
  get:
    tags:
      - Vehicle
    summary: Get Vehicle By ID
    description: Customers can only see their own vehicle; employees/managers/owners can view any vehicle by `vehid`.
    operationId: getVehicle
    responses:
      "200":
        description: Vehicle retrieved successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SuccessResponse"
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        vehicle:
                          $ref: "#/components/schemas/Vehicle"
  put:
    tags:
      - Vehicle
    summary: Update Vehicle Mileage
    description: Employees can update mileage for a vehicle by `vehid`.
    operationId: updateVehicle
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - vehmileage
            properties:
              vehmileage:
                type: integer
                example: 47000
    responses:
      "200":
        description: Vehicle mileage updated successfully
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/SuccessResponse"
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        vehicle:
                          $ref: "#/components/schemas/Vehicle"
  delete:
    tags:
      - Vehicle
    summary: Delete Vehicle
    description: Customers can delete their own vehicle by `vehid`.
    operationId: deleteVehicle
    responses:
      "200":
        description: Vehicle deleted successfully
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuccessResponse"
