/payment:
  get:
    tags:
      - Payment
    summary: Get All Payments
    description: Managers/Owners can view all payments.
    operationId: getAllPayments
    responses:
      "200":
        description: Payments retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: success
                message:
                  type: string
                  example: Payments retrieved successfully
                payments:
                  type: array
                  items:
                    type: object
                    properties:
                      paymentid:
                        type: integer
                        example: 2001
                      paymentdate:
                        type: string
                        format: date
                        example: "2025-01-15"
                      paymenttype:
                        type: string
                        enum: [cash, card, online]
                        example: card
                      paymentamount:
                        type: number
                        format: float
                        example: 1250.00
                      bookingid:
                        type: integer
                        example: 101
                      created_at:
                        type: string
                        format: date-time
                        example: "2025-01-15T09:30:00.000Z"
                      updated_at:
                        type: string
                        format: date-time
                        example: "2025-01-15T09:30:00.000Z"
  post:
    tags:
      - Payment
    summary: Create Payment
    description: Managers/Owners can create a new payment for a booking.
    operationId: createPayment
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - paymenttype
              - paymentamount
              - bookingid
            properties:
              paymentdate:
                type: string
                format: date
                description: Defaults to current date if omitted
                example: "2025-01-15"
              paymenttype:
                type: string
                enum: [cash, card, online]
                example: cash
              paymentamount:
                type: number
                format: float
                minimum: 0.01
                example: 1250.00
              bookingid:
                type: integer
                example: 101
    responses:
      "201":
        description: Payment created successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: success
                message:
                  type: string
                  example: Payment created successfully
                payment:
                  type: object
                  properties:
                    paymentid:
                      type: integer
                      example: 2002
                    paymentdate:
                      type: string
                      format: date
                      example: "2025-01-15"
                    paymenttype:
                      type: string
                      enum: [cash, card, online]
                      example: cash
                    paymentamount:
                      type: number
                      format: float
                      example: 1250.00
                    bookingid:
                      type: integer
                      example: 101
                    created_at:
                      type: string
                      format: date-time
                      example: "2025-01-15T09:30:00.000Z"
                    updated_at:
                      type: string
                      format: date-time
                      example: "2025-01-15T09:30:00.000Z"

