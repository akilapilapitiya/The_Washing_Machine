/payment/{paymentid}:
  parameters:
    - in: path
      name: paymentid
      required: true
      schema:
        type: integer
      description: Payment ID
  get:
    tags:
      - Payment
    summary: Get Payment By ID
    description: Customers can view their own payment; managers/owners can view any payment by `paymentid`.
    operationId: getPayment
    responses:
      "200":
        description: Payment retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: success
                message:
                  type: string
                  example: Payment retrieved successfully
                payment:
                  type: object
                  properties:
                    paymentid:
                      type: integer
                      example: 2001
                    paymentdate:
                      type: string
                      format: date
                      example: "2025-01-15"
                    paymenttype:
                      type: string
                      enum: [cash, card, online]
                      example: card
                    paymentamount:
                      type: number
                      format: float
                      example: 1250.00
                    bookingid:
                      type: integer
                      example: 101
                    created_at:
                      type: string
                      format: date-time
                      example: "2025-01-15T09:30:00.000Z"
                    updated_at:
                      type: string
                      format: date-time
                      example: "2025-01-15T09:30:00.000Z"
  put:
    tags:
      - Payment
    summary: Update Payment
    description: Managers/Owners can update fields of the payment with the given `paymentid`.
    operationId: updatePayment
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              paymentdate:
                type: string
                format: date
                example: "2025-01-16"
              paymenttype:
                type: string
                enum: [cash, card, online]
                example: online
              paymentamount:
                type: number
                format: float
                minimum: 0.01
                example: 1500.00
    responses:
      "200":
        description: Payment updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: success
                message:
                  type: string
                  example: Payment updated successfully
                payment:
                  type: object
                  properties:
                    paymentid:
                      type: integer
                      example: 2001
                    paymentdate:
                      type: string
                      format: date
                      example: "2025-01-16"
                    paymenttype:
                      type: string
                      enum: [cash, card, online]
                      example: online
                    paymentamount:
                      type: number
                      format: float
                      example: 1500.00
                    bookingid:
                      type: integer
                      example: 101
                    created_at:
                      type: string
                      format: date-time
                      example: "2025-01-16T10:00:00.000Z"
                    updated_at:
                      type: string
                      format: date-time
                      example: "2025-01-16T10:00:00.000Z"
  delete:
    tags:
      - Payment
    summary: Delete Payment
    description: Managers/Owners can delete the payment with the given `paymentid`.
    operationId: deletePayment
    responses:
      "200":
        description: Payment deleted successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: success
                message:
                  type: string
                  example: Payment deleted successfully
