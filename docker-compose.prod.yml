services:
  db:
    image: postgres:15-alpine
    container_name: washing_machine_db
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wm-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: washing_machine_redis
    networks:
      - wm-network
    restart: unless-stopped

  backend:
    image: ${CI_REGISTRY_IMAGE}/backend:latest
    container_name: washing_machine_backend
    env_file:
      - .env.prod
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      - db
      - redis
    networks:
      - wm-network
    restart: unless-stopped

  frontend:
    image: ${CI_REGISTRY_IMAGE}/frontend:latest
    container_name: washing_machine_frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - backend_uploads:/usr/share/nginx/html/uploads:ro
    networks:
      - wm-network
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: washing_machine_certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    networks:
      - wm-network
    restart: unless-stopped

networks:
  wm-network:
    driver: bridge

volumes:
  postgres_data:
  backend_uploads:
  certbot_certs:
  certbot_www:
