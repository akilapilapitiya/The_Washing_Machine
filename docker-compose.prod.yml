services:
  db:
    image: postgres:15-alpine
    container_name: washing_machine_db
    env_file:
      - .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wm-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: washing_machine_redis
    networks:
      - wm-network
    restart: unless-stopped

  backend:
    image: ${CI_REGISTRY_IMAGE}/backend:latest
    container_name: washing_machine_backend
    ports:
      - "5500:5500"
    env_file:
      - .env.prod
    depends_on:
      - db
      - redis
    networks:
      - wm-network
    restart: unless-stopped

  frontend:
    image: ${CI_REGISTRY_IMAGE}/frontend:latest
    container_name: washing_machine_frontend
    ports:
      - "80:80"
    networks:
      - wm-network
    restart: unless-stopped

networks:
  wm-network:
    driver: bridge

volumes:
  postgres_data:
