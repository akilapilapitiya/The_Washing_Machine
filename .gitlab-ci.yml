stages:
  - infra
  - build
  - deploy

variables:
  TF_ROOT: ${CI_PROJECT_DIR}/terraform
  TF_STATE_NAME: default
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend:latest
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend:latest

# ==========================================
# STAGE: INFRASTRUCTURE (Terraform)
# ==========================================
terraform:apply:
  stage: infra
  image:
    name: hashicorp/terraform:latest
    entrypoint: [""]
  before_script:
    - cd $TF_ROOT
    - terraform init
      -backend-config="address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
      -backend-config="lock_address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock"
      -backend-config="unlock_address=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock"
      -backend-config="username=${GITLAB_USER_LOGIN}"
      -backend-config="password=${GITLAB_TF_PASSWORD}"
      -backend-config="lock_method=POST"
      -backend-config="unlock_method=DELETE"
      -backend-config="retry_wait_min=5"
  script:
    - terraform apply -auto-approve
    - terraform output -raw instance_public_ip > ${CI_PROJECT_DIR}/server_ip.txt
  artifacts:
    paths:
      - server_ip.txt
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ==========================================
# STAGE: BUILD (Docker)
# ==========================================
build:backend:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $BACKEND_IMAGE ./backend
    - docker push $BACKEND_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build:frontend:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  dependencies:
    - terraform:apply
  before_script:
    - export SERVER_IP=$(cat server_ip.txt)
    - export VITE_API_BASE_URL="http://${SERVER_IP}:5500/api"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build 
      --build-arg VITE_API_BASE_URL=$VITE_API_BASE_URL 
      --build-arg VITE_GOOGLE_MAPS_API_KEY=$VITE_GOOGLE_MAPS_API_KEY 
      -t $FRONTEND_IMAGE ./frontend
    - docker push $FRONTEND_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ==========================================
# STAGE: DEPLOY (SSH to EC2)
# ==========================================
deploy:prod:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $(cat server_ip.txt) >> ~/.ssh/known_hosts
  script:
    - export SERVER_IP=$(cat server_ip.txt)
    - ssh azureuser@$SERVER_IP "mkdir -p app"
    - scp docker-compose.prod.yml azureuser@$SERVER_IP:~/app/
    - ssh azureuser@$SERVER_IP "cd app && docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
    - ssh azureuser@$SERVER_IP "cd app && CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE docker compose -f docker-compose.prod.yml pull"
    - ssh azureuser@$SERVER_IP "cd app && CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE docker compose -f docker-compose.prod.yml up -d"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
