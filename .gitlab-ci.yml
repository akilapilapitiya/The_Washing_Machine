      JWT_SECRET="secretme"
      JWT_EXPIRES_IN="1d"
      COOKIE_AGE=7
      SALT_ROUNDS=12
      OTP_EXPIRES_IN_MINUTES=10
      SMTP_HOST=smtp.gmail.com
      SMTP_PORT=465
      SMTP_SECURE=true
      SMTP_USER=akilapilapitiya4@gmail.com
      SMTP_PASS="zvof tkkw vmlj jyeb"
      GOOGLE_MAPS_API_KEY=AIzaSyBu-RIKloAJWiQ6xg8ljyralyM_92cgm44
      TELEGRAM_BOT_TOKEN=8307659618:AAGonWLa67vVcwAr2ndhXpYsDlH-_CDOoAE
      ENABLE_TELEGRAM_BOT=true
