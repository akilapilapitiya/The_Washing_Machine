server {
    listen 80;
    server_name washingmachine.truegate.live;

    # Let's Encrypt ACME challenge (needed to issue/renew cert)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name washingmachine.truegate.live;

    # SSL Certificates from Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/washingmachine.truegate.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/washingmachine.truegate.live/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api requests to the backend container (no need to expose port 5500 publicly)
    location /api {
        proxy_pass http://washing_machine_backend:5500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve /uploads directly from the Docker shared volume (lightning fast)
    location /uploads/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Serve static assets with long cache TTL
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # All routes fall back to index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
}
